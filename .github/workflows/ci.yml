name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Build COMPLETO del engine en Linux (el entorno real de desarrollo) + las
  # pruebas headless del subsistema FileManager.
  engine-ubuntu:
    name: Engine + tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglfw3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglm-dev \
            libncurses-dev \
            libassimp-dev \
            libbullet-dev \
            libasound2-dev \
            libxrandr-dev \
            libxi-dev \
            glslang-tools

      - name: Validar el GLSL embebido
        # El GLSL va embebido en el binario: un error de sintaxis no lo ve el
        # compilador de C++, solo el driver al compilar el programa. El
        # validador lo comprueba sin necesidad de GPU.
        run: python3 .github/scripts/validar-glsl.py

      - name: Configurar
        run: cmake -B build -S FunshiEngineGL -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_ASAN=OFF -DFUNSHI_JAVA=ON

      - name: Compilar engine
        run: cmake --build build --target FunshiEngineGL runtime-compile-check

      - name: Compilar pruebas
        run: cmake --build build --config Release --target terminal-emulator-tests terminal-session-tests diagnostic-registry-tests hilos-tests filemanager-tests importar-archivos-tests configuracion-tests eventbus-tests menu-tests assetmanager-tests texturemanager-tests estructuras-tests editor-input-tests rendering-tests particulas-tests particulas-textura-tests particulas-perfil-tests interfaz-ui-tests shaders-tests sombras-tests iluminacion-tests scripts-tests scripts-runtime-tests audio-tests musica-tests scripts-java-tests model-serialization-tests manifiesto-assets-tests orquestador-estado-tests tema-tests comandos-tests escena-serializacion-tests inspeccion-escena-tests emisor-particulas-tests ui-component-tests serializacion-tests proceso-tests prefab-tests catalogo-componentes-tests iconos-componentes-tests malla-regiones-tests materiales-regiones-tests primitivas3d-tests preview-material-tests tilemap-tests interfaces-juego-tests barra-progreso-tests interface-component-tests webui-runtime-tests mods-tests exportacion-tests

      - name: Ejecutar pruebas
        run: ctest --test-dir build -C Release --output-on-failure

  # Pruebas headless multiplataforma: compilan y corren sin la pila grafica en
  # Linux y Windows (con BUILD_ENGINE=OFF no se requieren libs externas).
  # macOS queda fuera por ahora: no se quiere mantener esa plataforma en el
  # build hasta que el sistema multiplataforma este mas maduro.
  # NOTA: los targets que exigen el motor (BUILD_ENGINE=ON) NO se incluyen
  # aqui: catalogo-componentes-tests, comandos-tests, escena-serializacion-tests,
  # exportacion-tests, iconos-componentes-tests, iluminacion-tests,
  # inspeccion-escena-tests, interfaces-juego-tests, malla-regiones-tests,
  # materiales-regiones-tests, manifiesto-assets-tests, orquestador-estado-tests,
  # prefab-tests, emisor-particulas-tests, preview-material-tests,
  # primitivas3d-tests, serializacion-tests, tema-tests y tilemap-tests.
  # interface-component-tests, shaders-tests, sombras-tests y
  # webui-runtime-tests tampoco entran: necesitan glm, que este build no trae.
  tests-multiplataforma:
    name: Pruebas headless (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (solo pruebas, sin engine)
        run: cmake -B build -S FunshiEngineGL -G Ninja -DBUILD_ENGINE=OFF -DENABLE_ASAN=OFF -DFUNSHI_JAVA=OFF

      - name: Compilar pruebas headless
        run: cmake --build build --target terminal-emulator-tests terminal-session-tests diagnostic-registry-tests hilos-tests filemanager-tests importar-archivos-tests configuracion-tests eventbus-tests menu-tests assetmanager-tests texturemanager-tests estructuras-tests editor-input-tests rendering-tests particulas-tests particulas-textura-tests particulas-perfil-tests interfaz-ui-tests scripts-tests scripts-runtime-tests audio-tests musica-tests model-serialization-tests proceso-tests barra-progreso-tests mods-tests

      - name: Ejecutar pruebas
        run: ctest --test-dir build --output-on-failure

  # Generador multi-config (Visual Studio): cada configuracion compila en su
  # propia carpeta, asi que lo que el proyecto genera en tiempo de
  # configuracion tiene que ser por configuracion. El job de Windows de
  # release.yml usa el generador por defecto (multi-config) y es el que
  # publica el instalador, asi que esta suite comprueba que el proyecto se
  # configura, compila y prueba bien ahi. Sin engine: no hacen falta las
  # dependencias graficas.
  tests-multi-config:
    name: Pruebas headless (multi-config)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (multi-config)
        run: cmake -B build -S FunshiEngineGL -DBUILD_ENGINE=OFF -DENABLE_ASAN=OFF -DFUNSHI_JAVA=OFF

      - name: Compilar pruebas headless
        run: cmake --build build --config Release --target terminal-emulator-tests terminal-session-tests diagnostic-registry-tests hilos-tests filemanager-tests importar-archivos-tests configuracion-tests eventbus-tests menu-tests assetmanager-tests texturemanager-tests estructuras-tests editor-input-tests rendering-tests particulas-tests particulas-textura-tests particulas-perfil-tests interfaz-ui-tests scripts-tests scripts-runtime-tests audio-tests musica-tests model-serialization-tests proceso-tests barra-progreso-tests mods-tests

      - name: Ejecutar pruebas
        run: ctest --test-dir build -C Release --output-on-failure

  # Motor completo con MSVC. El job de Windows de release.yml (el que publica
  # el instalador) es el unico que compila y ENLAZA el motor con Visual
  # Studio, y solo corre cuando hay tag: un fallo que solo aparece con MSVC
  # (por ejemplo un simbolo cuyo nombre depende del class-key del tipo) se
  # descubre al publicar, cuando corregirlo obliga a rehacer el tag. Este job
  # hace lo mismo en cada push: mismo generador (el por defecto, multi-config)
  # y mismas dependencias (vcpkg), y ademas corre las pruebas.
  engine-windows:
    name: Engine + tests (Windows + MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar cache de dependencias vcpkg
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-v1

      - name: Instalar dependencias (vcpkg)
        shell: pwsh
        run: vcpkg install glfw3 assimp bullet3 glm --triplet x64-windows

      - name: Guardar cache de dependencias vcpkg
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-v1

      - name: Configurar
        run: >
          cmake -B build -S FunshiEngineGL
          -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_ASAN=OFF
          -DFUNSHI_JAVA=ON

      - name: Compilar engine
        run: cmake --build build --config Release --target FunshiEngineGL runtime-compile-check

      - name: Compilar pruebas
        run: cmake --build build --config Release --target terminal-emulator-tests terminal-session-tests diagnostic-registry-tests hilos-tests filemanager-tests importar-archivos-tests configuracion-tests eventbus-tests menu-tests assetmanager-tests texturemanager-tests estructuras-tests editor-input-tests rendering-tests particulas-tests particulas-textura-tests particulas-perfil-tests interfaz-ui-tests shaders-tests sombras-tests iluminacion-tests scripts-tests scripts-runtime-tests audio-tests musica-tests interface-component-tests barra-progreso-tests scripts-java-tests model-serialization-tests manifiesto-assets-tests orquestador-estado-tests tema-tests comandos-tests escena-serializacion-tests inspeccion-escena-tests emisor-particulas-tests ui-component-tests serializacion-tests proceso-tests prefab-tests catalogo-componentes-tests iconos-componentes-tests malla-regiones-tests materiales-regiones-tests primitivas3d-tests preview-material-tests tilemap-tests interfaces-juego-tests webui-runtime-tests mods-tests exportacion-tests

      - name: Ejecutar pruebas
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: any
          command: ctest --test-dir build -C Release --output-on-failure

  # Backend de scripts Java (JNI). Requiere JDK en el runner; solo Linux.
  tests-java:
    name: Scripts Java (Ubuntu + JDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar (solo pruebas, con Java)
        run: cmake -B build -S FunshiEngineGL -G Ninja -DBUILD_ENGINE=OFF -DENABLE_ASAN=OFF -DFUNSHI_JAVA=ON

      - name: Compilar prueba Java
        run: cmake --build build --target scripts-java-tests

      - name: Ejecutar prueba Java
        run: ctest --test-dir build -R scripts-java-tests --output-on-failure
